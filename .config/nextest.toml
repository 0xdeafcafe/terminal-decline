# cargo-nextest settings. Run locally with `cargo nextest run --workspace`;
# CI uses `--profile ci`. nextest does not run doctests: use
# `cargo test --workspace --doc` for those.

[profile.default]
# A test running for 15 s is reported as slow; after 4 periods (60 s) it is
# killed, so a hung PTY or GUI test can't stall a run.
slow-timeout = { period = "15s", terminate-after = 4 }
# No retries: a flaky test is a bug to fix, not to hide.
retries = 0

# Tests that drive the real app (window server, Dock, LaunchServices) can't
# share the machine with each other, so they run one at a time.
[[profile.default.overrides]]
filter = 'binary(smoke)'
test-group = "gui"

# Tests that make an app bundle first build its parts (library, launcher,
# pin stub) into target/bundle-test; on a cold CI cache that takes minutes.
[[profile.default.overrides]]
filter = 'binary(bundle) | test(/bundle|stub_pin/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Property tests that run thousands of generated cases (term-core's props and
# Unicode streams) take 30–90 s on a loaded Mac; they aren't hung.
[[profile.default.overrides]]
filter = 'package(term-core) & (binary(props) | binary(unicode) | binary(history))'
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
# Written to target/nextest/ci/junit.xml
path = "junit.xml"

[test-groups]
gui = { max-threads = 1 }
