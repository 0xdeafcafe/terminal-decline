name: CI

# Budget: the whole PR run should finish in about 10 minutes. Jobs run in
# parallel; the macOS job is the long pole.

on:
  push:
    # `ci/**`: a branch to try a fix on the runners without opening a PR.
    # `rush/**`: agents' branches, checked here instead of on the Mac.
    branches: [main, "ci/**", "rush/**"]
    paths-ignore:
      - "site/**"
  pull_request:
    paths-ignore:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # sccache keeps our own crates built in GitHub's cache, so a push
  # rebuilds only the crates it changed (rust-cache keeps dependencies).
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo fmt --all -- --check
      - name: fmt (fuzz crate, outside the workspace)
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Script self-tests
        run: |
          python3 scripts/bench-gate.py --self-test
          python3 scripts/fuzz-signature.py --self-test
          python3 scripts/appcast.py --self-test
          python3 scripts/perf-watch/perf_watch.py --self-test
      - name: Seed corpus is up to date
        run: python3 scripts/fuzz-seed.py --check

  core-linux:
    name: term-core and term-pty (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          # Branches start from main's; only main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Unit, integration, property and doctests, plus the fuzz corpus replay.
      - name: cargo test -p term-core
        run: cargo test -p term-core --locked
      # TODO: drop continue-on-error once term-pty builds on Linux.
      - name: cargo test -p term-pty
        continue-on-error: true
        run: cargo test -p term-pty --locked

  macos:
    name: clippy and tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Also keeps target/bundle-test, where the bundle tests build the
      # library, launcher and stub (rust-cache cleans and keeps target
      # dirs nested in target/).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          # Branches start from main's; only main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The pinned Sparkle, for the updater's protocol test
      # (docs/design/updater.md §5.1).
      - name: Fetch Sparkle
        run: scripts/sparkle.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked --profile ci
      # nextest does not run doctests
      - run: cargo test --workspace --doc --locked
      - name: Cache use
        if: always()
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-macos
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  fuzz-build:
    name: fuzz target builds (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          # Branches start from main's; only main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # No target named: builds all of them.
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu

  smoke:
    name: app smoke tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The bundled-app smoke tests embed the pinned Sparkle.
      - name: Fetch Sparkle
        run: scripts/sparkle.sh
      - run: cargo nextest run --workspace --locked --profile ci --run-ignored only -E 'binary(smoke)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
