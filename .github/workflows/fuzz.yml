name: Fuzz

# Nightly: every target in fuzz/, one job each (a matrix), starting from the
# committed seeds plus the corpus kept in the Actions cache (one cache entry
# per target). `parse` (terminal output with images on, see
# fuzz/steps.rs) gets 20 minutes; the term-image targets (`sixel`,
# `kitty_keys`, `iterm_args`, `inflate`, `sniff`, `decode`) get 5 each.
# Sundays also minimise the corpora (cmin). A crash is minimised (tmin),
# uploaded as `fuzz-crash-<target>`, and reported: one open issue per
# signature (panic message + top frame), the target in the title.

on:
  schedule:
    - cron: "0 2 * * 1-6"
    - cron: "0 2 * * 0" # Sunday: also minimise the corpus
  workflow_dispatch:
    inputs:
      targets:
        description: Targets to fuzz, space separated (default all)
        default: ""
      minutes:
        description: Minutes to fuzz each target (default 20 for parse, 5 for the rest)
        default: ""
      cmin:
        description: Minimise the corpora afterwards
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          # target:default minutes:dictionary
          all="parse:20:parse.dict sixel:5:sixel.dict kitty_keys:5:kitty_keys.dict iterm_args:5:iterm_args.dict inflate:5: sniff:5: decode:5:decode.dict"
          include="[]"
          for entry in $all; do
            IFS=: read -r target minutes dict <<<"$entry"
            if [ -n "$TARGETS" ] && ! [[ " $TARGETS " == *" $target "* ]]; then continue; fi
            include=$(jq -c --arg t "$target" --arg m "${MINUTES:-$minutes}" --arg d "$dict" \
              '. + [{target: $t, minutes: $m, dict: $d, timeout: (if $t == "parse" then 45 else 25 end)}]' <<<"$include")
          done
          if [ "$include" = "[]" ]; then
            echo "::error::no known target in '$TARGETS'"
            exit 1
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: plan
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - run: cargo fuzz build --target x86_64-unknown-linux-gnu "$TARGET"

      - name: Fuzz
        id: run
        env:
          MINUTES: ${{ matrix.minutes }}
          DICT: ${{ matrix.dict }}
          RUST_BACKTRACE: "1"
          # `parse` runs with images on (fuzz/steps.rs); named here so the
          # run says so.
          TD_FUZZ_IMAGES: "1"
        run: |
          set +e
          corpus="fuzz/corpus/$TARGET"
          mkdir -p "$corpus"
          dict=()
          if [ -n "$DICT" ]; then dict=("-dict=$GITHUB_WORKSPACE/fuzz/$DICT"); fi
          before=$(find "$corpus" -type f | wc -l)
          cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- \
            -max_total_time=$((MINUTES * 60)) -timeout=10 -rss_limit_mb=2048 \
            "${dict[@]}" -print_final_stats=1 2>&1 | tee fuzz.log
          code=${PIPESTATUS[0]}
          after=$(find "$corpus" -type f | wc -l)
          crash=$(find "fuzz/artifacts/$TARGET" -type f \( -name 'crash-*' -o -name 'oom-*' -o -name 'timeout-*' -o -name 'leak-*' \) 2>/dev/null | head -n 1)
          {
            echo "### Fuzz \`$TARGET\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| exit code | $code |"
            echo "| corpus files | $before → $after |"
            echo "| final stats | $(grep -E '^stat::(number_of_executed_units|average_exec_per_sec|new_units_added|peak_rss_mb)' fuzz.log | tr '\n' ' ') |"
            echo "| crash | ${crash:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$crash" ]; then
            echo "crashed=true" >> "$GITHUB_OUTPUT"
            echo "input=$crash" >> "$GITHUB_OUTPUT"
          else
            echo "crashed=false" >> "$GITHUB_OUTPUT"
            # Failed without leaving an input behind: nothing to report, but
            # still a failure.
            exit "$code"
          fi

      - name: Minimise crash
        if: steps.run.outputs.crashed == 'true'
        env:
          INPUT: ${{ steps.run.outputs.input }}
          RUST_BACKTRACE: "1"
        run: |
          mkdir -p crash
          cp "$INPUT" crash/raw-input
          cargo fuzz tmin --target x86_64-unknown-linux-gnu "$TARGET" "$INPUT" -r 2000 2>&1 | tee tmin.log || true
          min=$(find "fuzz/artifacts/$TARGET" -type f -name 'minimized-from-*' | head -n 1)
          if [ -n "$min" ]; then
            cp "$min" crash/minimized-input
            # Log of the minimised input alone, for the signature.
            cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" crash/minimized-input 2>&1 | tee crash/minimized.log || true
          fi
          cargo fuzz fmt --target x86_64-unknown-linux-gnu "$TARGET" "${min:-$INPUT}" > crash/steps.txt 2>&1 || true

      - name: Work out signature
        id: signature
        if: steps.run.outputs.crashed == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p crash
          cp fuzz.log crash/fuzz.log
          [ -f tmin.log ] && cp tmin.log crash/tmin.log
          log=crash/fuzz.log
          [ -s crash/minimized.log ] && log=crash/minimized.log
          python3 scripts/fuzz-signature.py "$log" --report crash/issue.md \
            --input crash/raw-input --minimized crash/minimized-input --run-url "$RUN_URL"
          # For the report job, which sees the artifact and not these outputs.
          printf '%s' "$(grep '^signature=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" > crash/signature
          printf '%s' "[$TARGET] $(grep '^title=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" > crash/title

      - name: Upload crash
        if: steps.run.outputs.crashed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crash/
          retention-days: 90

      - name: Minimise corpus
        if: github.event.schedule == '0 2 * * 0' || inputs.cmin
        run: cargo fuzz cmin --target x86_64-unknown-linux-gnu "$TARGET" "fuzz/corpus/$TARGET"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Fail on crash
        if: steps.run.outputs.crashed == 'true'
        run: |
          echo "::error title=fuzz crash ($TARGET)::$(cat crash/title)"
          exit 1

  report:
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # One artifact per target that crashed.
      - uses: actions/download-artifact@v4
        with:
          pattern: fuzz-crash-*
          path: crashes
      - name: Open or update issues
        run: |
          gh label create fuzz --color B60205 --description "Found by the nightly fuzz run" 2>/dev/null || true
          for dir in crashes/*/; do
            SIGNATURE=$(cat "$dir/signature")
            TITLE=$(cat "$dir/title")
            existing=$(gh issue list --label fuzz --state open --limit 200 --json number,body \
              --jq ".[] | select(.body | contains(\"fuzz-signature: $SIGNATURE\")) | .number" | head -n 1)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Found again by $RUN_URL (same signature \`$SIGNATURE\`)."
              echo "Commented on #$existing" >> "$GITHUB_STEP_SUMMARY"
            else
              url=$(gh issue create --label fuzz --title "$TITLE" --body-file "$dir/issue.md")
              echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
