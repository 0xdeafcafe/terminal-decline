name: Nightly tests

# Property tests with many more cases and a new random seed every night, in
# an optimised build that keeps debug assertions (so `check_invariants` runs)
# and overflow checks. A failure uploads proptest's regression files: commit
# them so the case runs on every PR from then on.
#
# Also vttest and esctest2 (the conformance job): a failure not in
# tests/conformance/accepted-failures.txt, or a listed one that now passes,
# fails it.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Proptest RNG seed (empty for random)
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: "5000"
  # The `ci-prop` profile. Defined here so this works before
  # `[profile.ci-prop]` is in Cargo.toml; the values match that snippet.
  CARGO_PROFILE_CI_PROP_INHERITS: release
  CARGO_PROFILE_CI_PROP_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_CI_PROP_OVERFLOW_CHECKS: "true"
  CARGO_PROFILE_CI_PROP_PANIC: unwind
  CARGO_PROFILE_CI_PROP_LTO: "false"
  CARGO_PROFILE_CI_PROP_CODEGEN_UNITS: "16"
  CARGO_PROFILE_CI_PROP_INCREMENTAL: "false"

jobs:
  changed:
    # Scheduled macOS runs cost 10x while the repo is private: skip them
    # when main hasn't changed since the last scheduled run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ -n "$(git log --since='25 hours ago' --format=%H -1)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main unchanged since the last scheduled run; skipping" >> "$GITHUB_STEP_SUMMARY"
          fi

  proptest:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: property tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: term-core, ubuntu
            os: ubuntu-latest
            packages: -p term-core
          - name: workspace, macOS
            os: macos-latest
            packages: --workspace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-prop
      - name: Pick seed
        env:
          SEED: ${{ inputs.seed }}
        run: |
          seed="${SEED:-$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')}"
          echo "PROPTEST_RNG_SEED=$seed" >> "$GITHUB_ENV"
          echo "Proptest seed: \`$seed\` (re-run with workflow_dispatch and this seed to reproduce)" >> "$GITHUB_STEP_SUMMARY"
      - name: Tests
        run: cargo test --profile ci-prop --locked ${{ matrix.packages }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: proptest-regressions-${{ matrix.os }}
          path: |
            **/proptest-regressions/
          if-no-files-found: warn

  conformance:
    # vttest and esctest2 against the headless terminal, checked against
    # tests/conformance/accepted-failures.txt (see docs/conformance.md).
    needs: changed
    if: needs.changed.outputs.run == 'true'
    name: conformance (vttest, esctest2)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance
      - name: vttest and esctest2
        run: python3 scripts/conformance/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: target/conformance/results/
          if-no-files-found: warn
