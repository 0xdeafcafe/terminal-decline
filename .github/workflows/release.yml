name: Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changed:
    # Scheduled macOS runs cost 10x while the repo is private: skip them
    # when main hasn't changed since the last scheduled run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ -n "$(git log --since='25 hours ago' --format=%H -1)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main unchanged since the last scheduled run; skipping" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      # What the sign job needs to know before publishing updates
      # (docs/design/updater.md §6.1); it checks the app itself too.
      signing: ${{ steps.cert.outputs.identity != '' && 'developer-id' || 'ad-hoc' }}
      notarized: ${{ steps.notarize.outcome == 'success' }}
      zip: ${{ steps.package.outputs.zip }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="terminal-decline") | .version')
            version="${base}-nightly.$(date -u +%Y%m%d)"
          fi
          # CFBundleVersion: an integer that only goes up.
          build=$(git rev-list --count HEAD)
          {
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon)
        run: |
          # The library (docs/design/pins.md §2.5), then the launcher and
          # the pin stub in a cargo run of their own: their profile,
          # release-stub, aborts on panic and is stripped.
          cargo build --release --locked -p term-dylib --target aarch64-apple-darwin
          cargo build --locked -p term-pin --bins --profile release-stub --target aarch64-apple-darwin
          mkdir -p dist

      - name: Import signing certificate
        id: cert
        if: env.APPLE_CERT_P12 != '' && env.APPLE_CERT_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_pw=$(uuidgen)
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pw" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Fetch Sparkle
        run: scripts/sparkle.sh

      - name: Bundle and sign Terminal Decline.app
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          # Falls back to ad-hoc signing when no certificate was imported.
          SPARKLE_REQUIRED=1 CODESIGN_IDENTITY="${SIGN_IDENTITY:--}" scripts/bundle.sh \
            --lib target/aarch64-apple-darwin/release/libterminal_decline.dylib \
            --launcher target/aarch64-apple-darwin/release-stub/terminal-decline-launcher \
            --stub target/aarch64-apple-darwin/release-stub/terminal-decline-pin \
            dist "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.build }}"

      - name: Notarize and staple
        id: notarize
        if: steps.cert.outputs.identity != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          ditto -c -k --keepParent "dist/Terminal Decline.app" dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "dist/Terminal Decline.app"
          rm dist/notarize.zip

      - name: Zip and checksum
        id: package
        run: |
          zip_name="Terminal-Decline-${{ steps.meta.outputs.version }}-macos-arm64.zip"
          ditto -c -k --keepParent "dist/Terminal Decline.app" "dist/$zip_name"
          (cd dist && shasum -a 256 "$zip_name" > "$zip_name.sha256")
          # Debug symbols for symbolicating crash logs from this build
          # (split-debuginfo = "packed" makes cargo run dsymutil), one per
          # shipped image, named after it as crash logs name it: the
          # library (where the code is), the launcher and the stub. Each
          # UUID must match the shipped file's. Cargo's dSYMs are symlinks
          # into deps/, so copy what they point to.
          app="dist/Terminal Decline.app/Contents"
          dsyms=dist/dSYMs
          mkdir -p "$dsyms"
          check() { # <shipped file> <cargo's dSYM> <name>
            cp -RL "$2" "$dsyms/$3.dSYM"
            bin_uuid=$(dwarfdump --uuid "$1" | awk '{print $2}')
            dsym_uuid=$(dwarfdump --uuid "$dsyms/$3.dSYM" | awk '{print $2}')
            if [[ -z "$bin_uuid" || "$bin_uuid" != "$dsym_uuid" ]]; then
              echo "$3.dSYM UUID $dsym_uuid doesn't match the shipped $1's $bin_uuid" >&2
              exit 1
            fi
          }
          check "$app/Frameworks/libterminal_decline.dylib" target/aarch64-apple-darwin/release/libterminal_decline.dylib.dSYM libterminal_decline.dylib
          check "$app/MacOS/terminal-decline" target/aarch64-apple-darwin/release-stub/terminal-decline-launcher.dSYM terminal-decline
          check "$app/Helpers/terminal-decline-pin" target/aarch64-apple-darwin/release-stub/terminal-decline-pin.dSYM terminal-decline-pin
          (cd "$dsyms" && ditto -c -k . "../Terminal-Decline-${{ steps.meta.outputs.version }}-macos-arm64.dSYM.zip")
          # Every released stub is kept and run against later libraries
          # (crates/term-pin/FROZEN.md, TD_PIN_TEST_STUB).
          cp "$app/Helpers/terminal-decline-pin" "dist/terminal-decline-pin-${{ steps.meta.outputs.version }}-arm64"
          ditto -c -k "dist/terminal-decline-pin-${{ steps.meta.outputs.version }}-arm64" "dist/terminal-decline-pin-${{ steps.meta.outputs.version }}-arm64.zip"
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "dist/$zip_name.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: terminal-decline-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  nightly:
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: terminal-decline-macos-arm64
          path: dist
      - name: Publish rolling nightly prerelease
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (${{ needs.build.outputs.version }})" \
            --notes "Automated nightly build of ${GITHUB_SHA}. Ad-hoc or Developer ID signed depending on repository secrets. Not for production use."

  sign:
    # Signs the update and writes the appcast (docs/design/updater.md
    # §6.1). A job of its own, in the `release` environment, so the
    # EdDSA key is never in the build job's environment (cargo build runs
    # every dependency's build script). Sparkle trusts the EdDSA key
    # alone, so updates are published only for notarized Developer ID
    # builds: without them this job says why in the summary and the
    # release goes out without an appcast, until updates have started;
    # from then on it fails, since a release without an appcast would
    # become `latest` and stop every installed copy updating.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      ZIP: dist/${{ needs.build.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: terminal-decline-macos-arm64
          path: dist

      - name: Fetch Sparkle
        run: scripts/sparkle.sh

      # Every tag, whether or not updates are published: our bundle id and
      # the tag's version, the committed public key, the release feed, and
      # none of the test-build switches.
      - name: Check it is a release build
        run: python3 scripts/appcast.py check-release "$ZIP" --public-key packaging/sparkle-public-key --version "$VERSION"

      - name: Fetch the current appcast
        id: previous
        run: |
          mkdir -p previous
          # Only "no release yet" counts as no appcast: any other error
          # fails here, rather than being taken for the first release.
          if ! view=$(gh release view --json tagName,assets 2>&1); then
            if [[ "$view" != *"release not found"* ]]; then
              echo "::error::gh release view: $view"
              exit 1
            fi
            view='{"tagName": "", "assets": []}'
          fi
          latest=$(jq -r .tagName <<< "$view")
          if jq -e '.assets | any(.name == "appcast.xml")' <<< "$view" > /dev/null; then
            gh release download "$latest" --pattern appcast.xml --dir previous
            echo "started=true" >> "$GITHUB_OUTPUT"
            newest=$(python3 scripts/appcast.py newest previous/appcast.xml)
            echo "current appcast ($latest): $newest"
            # The key users actually have: the newest published app's.
            url=$(jq -r .url <<< "$newest")
            prefix="https://github.com/$GH_REPO/releases/download/"
            if [[ "$url" != "$prefix"* ]]; then
              echo "::error::the current appcast's newest item points at $url"
              exit 1
            fi
            path=${url#"$prefix"}
            gh release download "${path%%/*}" --pattern "${path#*/}" --dir previous
            theirs=$(python3 scripts/appcast.py public-key "previous/${path#*/}")
            ours=$(tr -d '[:space:]' < packaging/sparkle-public-key)
            if [[ "$theirs" != "$ours" ]]; then
              echo "::error::SUPublicEDKey of the latest release ($theirs) differs from packaging/sparkle-public-key ($ours); installed copies would refuse this update"
              exit 1
            fi
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
            echo "no appcast in the latest release (${latest:-none}): this is the first one"
          fi

      - name: Decide whether to publish updates
        id: decide
        env:
          SIGNING: ${{ needs.build.outputs.signing }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
          HAS_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
          STARTED: ${{ steps.previous.outputs.started }}
        run: |
          reasons=()
          [[ "$SIGNING" == developer-id ]] \
            || reasons+=("the app is ad-hoc signed (the APPLE_CERT_P12 and APPLE_CERT_PASSWORD secrets aren't set)")
          [[ "$NOTARIZED" == true ]] \
            || reasons+=("the app isn't notarized (needs the Developer ID certificate and the APPLE_ID and APPLE_APP_PASSWORD secrets)")
          [[ "$HAS_KEY" == true ]] \
            || reasons+=("the SPARKLE_ED_PRIVATE_KEY secret isn't set")
          if [[ ${#reasons[@]} -eq 0 ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=false" >> "$GITHUB_OUTPUT"
          {
            echo "### No update published for $VERSION"
            echo
            echo "Installed copies won't be offered this release, because:"
            printf -- '- %s\n' "${reasons[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STARTED" == true ]]; then
            echo "Updates have started (the latest release has an appcast), so this release must publish one too." >> "$GITHUB_STEP_SUMMARY"
            for r in "${reasons[@]}"; do echo "::error::$r"; done
            exit 1
          fi
          for r in "${reasons[@]}"; do echo "::warning::no update published: $r"; done

      - name: Check the team and notarization
        if: steps.decide.outputs.publish == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p unpacked
          ditto -x -k "$ZIP" unpacked
          app="unpacked/Terminal Decline.app"
          codesign --verify --strict --deep "$app"
          for code in "$app" "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"; do
            team=$(codesign -dv --verbose=2 "$code" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            if [[ -z "$APPLE_TEAM_ID" || "$team" != "$APPLE_TEAM_ID" ]]; then
              echo "::error::$code is signed by team '${team}', not APPLE_TEAM_ID"
              exit 1
            fi
          done
          spctl --assess --type exec -vv "$app" 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt
          xcrun stapler validate "$app"

      # The key on stdin, never on disk, and only in the two steps that
      # sign.
      - name: Sign the update
        id: sign
        if: steps.decide.outputs.publish == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          sparkle=$(scripts/sparkle.sh --print-dir)
          sig=$(printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$sparkle/bin/sign_update" --ed-key-file - -p "$ZIP")
          echo "signature=$sig" >> "$GITHUB_OUTPUT"

      # sign_update --verify checks against the key it was given, so it
      # can't tell that the secret is the wrong key; this checks against
      # the committed public key, which the app carries (checked above)
      # and the latest release carries (checked when fetching the
      # appcast).
      - name: Check the signature with the committed public key
        if: steps.decide.outputs.publish == 'true'
        env:
          SIGNATURE: ${{ steps.sign.outputs.signature }}
        run: python3 scripts/appcast.py verify "$ZIP" --public-key packaging/sparkle-public-key --signature "$SIGNATURE"

      # Fails unless the build number is above every published one.
      - name: Write the appcast
        if: steps.decide.outputs.publish == 'true'
        env:
          SIGNATURE: ${{ steps.sign.outputs.signature }}
        run: |
          mkdir -p appcast
          python3 scripts/appcast.py write --zip "$ZIP" --signature "$SIGNATURE" --previous previous/appcast.xml --out appcast/appcast.xml

      - name: Sign the appcast
        if: steps.decide.outputs.publish == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          sparkle=$(scripts/sparkle.sh --print-dir)
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$sparkle/bin/sign_update" --ed-key-file - appcast/appcast.xml
          python3 scripts/appcast.py verify-feed appcast/appcast.xml --public-key packaging/sparkle-public-key
          {
            echo "### Update published for $VERSION"
            echo
            echo '```xml'
            cat appcast/appcast.xml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          name: appcast
          path: appcast/appcast.xml
          if-no-files-found: error

  release:
    needs: [build, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: terminal-decline-macos-arm64
          path: dist
      # The appcast goes up as an asset of this release, which becomes
      # `latest`: releases/latest/download/appcast.xml is the feed every
      # installed copy reads (SUFeedURL).
      - uses: actions/download-artifact@v4
        if: needs.sign.outputs.publish == 'true'
        with:
          name: appcast
          path: dist
      - name: Check the appcast is there
        if: needs.sign.outputs.publish == 'true'
        run: test -s dist/appcast.xml
      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Terminal Decline $VERSION" \
            --generate-notes \
            --notes "SHA-256 of the zip: \`$SHA256\`"

      - name: Update Homebrew cask
        if: env.HOMEBREW_TAP_DEPLOY_KEY != ''
        run: |
          # A deploy key with write access to the tap only (no personal
          # token to expire).
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:0xdeafcafe/homebrew-tap.git tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/homebrew/terminal-decline.rb > tap/Casks/terminal-decline.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The cask was called decline before the rename: brew follows
          # cask_renames.json to the new one.
          git rm -q --ignore-unmatch Casks/decline.rb
          [[ -f cask_renames.json ]] || echo '{}' > cask_renames.json
          jq '. + {"decline": "terminal-decline"}' cask_renames.json > cask_renames.json.new
          mv cask_renames.json.new cask_renames.json
          git add Casks/terminal-decline.rb cask_renames.json
          if git diff --cached --quiet; then
            echo "cask already up to date"
          else
            git commit -m "terminal-decline $VERSION"
            git push
          fi
