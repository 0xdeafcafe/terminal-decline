name: Weekly

# Pressure scenarios against the release build (scripts/pressure/run.py),
# failing if any scenario doesn't survive, and a coverage report that never
# fails the run.

on:
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      scenarios:
        description: Pressure scenarios to run (space separated, empty for all)
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changed:
    # Scheduled macOS runs cost 10x while the repo is private: skip them
    # when main hasn't changed since the last scheduled run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ -n "$(git log --since='8 days ago' --format=%H -1)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main unchanged since the last scheduled run; skipping" >> "$GITHUB_STEP_SUMMARY"
          fi

  pressure:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --release --locked -p decline

      - name: Make inputs
        run: |
          WORK="$RUNNER_TEMP/pressure"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK"
          python3 scripts/pressure/gen.py big "$WORK/big.txt" 100000000
          python3 scripts/pressure/gen.py fuzz "$WORK/fuzz.bin" 64000000
          python3 scripts/pressure/gen.py glyphs "$WORK/glyphs.txt"
          ls -l "$WORK"

      - name: Run scenarios
        id: run
        continue-on-error: true
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          # shellcheck disable=SC2086 # word splitting of the scenario list is intended
          python3 scripts/pressure/run.py target/release/decline "$WORK" $SCENARIOS | tee pressure.jsonl

      - name: Summary
        if: always()
        run: python3 scripts/pressure/summary.py pressure.jsonl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pressure
          path: |
            pressure.jsonl
            ${{ runner.temp }}/pressure/shot-*.png
          if-no-files-found: warn

      - name: Fail if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1

  coverage:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    # Report only: finds gaps, never blocks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          {
            echo "### Coverage"
            echo ""
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            lcov.info
            coverage/
          if-no-files-found: warn
