[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored dependencies, used through [patch.crates-io] below and kept out
# of the workspace's fmt and clippy runs.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT"
repository = "https://github.com/0xdeafcafe/terminal-decline"

[workspace.dependencies]
term-core = { path = "crates/term-core" }
term-pty = { path = "crates/term-pty" }
term-font = { path = "crates/term-font" }
term-render = { path = "crates/term-render" }
term-prefs = { path = "crates/term-prefs" }
term-image = { path = "crates/term-image" }
term-keys = { path = "crates/term-keys" }
term-config = { path = "crates/term-config" }
term-import = { path = "crates/term-import" }
term-activity = { path = "crates/term-activity" }
term-restore = { path = "crates/term-restore" }
term-complete = { path = "crates/term-complete" }
term-ctl = { path = "crates/term-ctl" }
term-update = { path = "crates/term-update" }
term-pins = { path = "crates/term-pins" }
vte = "0.15"
libc = "0.2"
unicode-width = "0.2"
# The hand-weighted net that marks why a command failed.
linetag = { git = "https://github.com/0xdeafcafe/linetag", rev = "0f0a801e6847761052795b686e1901bce1e27263" }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std"] }

# vte, vendored with local changes listed in vendor/vte/README.md.
[patch.crates-io]
vte = { path = "vendor/vte" }

[profile.release]
lto = "thin"
codegen-units = 1
# Unwind, so a bug in one window's parser stops only that window (see
# crates/term-app/src/crash.rs). A panic on the main thread still aborts.
panic = "unwind"
debug = "line-tables-only"
# A terminal-decline.dSYM next to the binary, kept per release to symbolicate crashes.
split-debuginfo = "packed"

# The pin stub and the app's launcher (crates/term-pin), built in a cargo
# run of their own: `cargo build -p term-pin --bins --profile release-stub`.
# Cargo doesn't allow `panic` in a per-package profile and the release
# profile unwinds, hence a whole profile. Small, since every pin carries a
# copy of the stub; a panic in either aborts (neither has windows to
# keep). The binaries are stripped; their dSYMs (packed, as release) are
# kept with each release like the library's.
[profile.release-stub]
inherits = "release"
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
