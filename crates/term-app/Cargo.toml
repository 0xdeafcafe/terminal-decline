[package]
name = "terminal-decline"
edition.workspace = true
version.workspace = true
description = "A fast, GPU-accelerated terminal for macOS"
license.workspace = true
repository.workspace = true

[lib]
name = "terminal_decline"
path = "src/lib.rs"

# The cask also links it as `decline`.
[[bin]]
name = "terminal-decline"
path = "src/main.rs"

[dependencies]
term-core.workspace = true
term-pty.workspace = true
term-font.workspace = true
term-render.workspace = true
objc2.workspace = true
block2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
objc2-core-foundation.workspace = true
dispatch2 = "0.3"
objc2-user-notifications = "0.3"
libc.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"

[features]
# Test-only: output containing `session::TEST_PANIC` makes the parse step
# panic. The tests turn it on through the dev-dependency below; release
# builds never have it.
test-hooks = []

[dev-dependencies]
terminal-decline = { path = ".", features = ["test-hooks"] }
