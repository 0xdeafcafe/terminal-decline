[package]
name = "terminal-decline"
edition.workspace = true
version.workspace = true
description = "A fast, GPU-accelerated terminal for macOS"
license.workspace = true
repository.workspace = true

# Not `terminal_decline`: that is crates/term-dylib's, whose file must be
# libterminal_decline.dylib (docs/design/pins.md §2.5).
[lib]
name = "terminal_decline_app"
path = "src/lib.rs"

# The cask also links it as `decline`.
[[bin]]
name = "terminal-decline"
path = "src/main.rs"

[dependencies]
term-core.workspace = true
term-pty.workspace = true
term-font.workspace = true
term-render.workspace = true
term-image.workspace = true
term-prefs.workspace = true
term-keys.workspace = true
term-config.workspace = true
term-import.workspace = true
term-activity.workspace = true
term-restore.workspace = true
term-complete.workspace = true
term-ctl.workspace = true
term-update.workspace = true
term-pins.workspace = true
term-pin = { path = "../term-pin" }
term-icon = { path = "../term-icon" }
objc2-core-text.workspace = true
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSAttributedString", "NSGeometry", "NSKeyValueObserving", "NSNotification", "NSObjCRuntime", "NSRunLoop", "NSSet", "NSString", "NSUserDefaults", "NSValue", "objc2-core-foundation"] }
objc2-app-kit = { workspace = true, features = ["NSAccessibility", "NSAlert", "NSAnimation", "NSAnimationContext", "NSAppearance", "NSApplication", "NSApplicationScripting", "NSBox", "NSButton", "NSCell", "NSColor", "NSColorSpace", "NSControl", "NSCursor", "NSDockTile", "NSDragging", "NSEvent", "NSFont", "NSGraphics", "NSGraphicsContext", "NSImage", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSSearchField", "NSSegmentedControl", "NSText", "NSTextField", "NSTextFinder", "NSTextInputClient", "NSTextInputContext", "NSTextView", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow", "NSWindowTabGroup", "NSWorkspace", "block2", "libc", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-metal = { workspace = true, features = ["MTLCommandBuffer", "MTLDrawable", "objc2-core-foundation"] }
objc2-quartz-core = { workspace = true, features = ["CADisplayLink", "CAFrameRateRange", "CAMetalLayer", "objc2-core-foundation"] }
objc2-core-foundation = { workspace = true, features = ["CFPreferences"] }
dispatch2 = "0.3"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter", "block2", "std"] }
libc.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
# The agent API: wait-for --regex, and screenshots as PNG.
regex-lite = "0.1"
png = "0.18"

[features]
# Test-only: output containing `session::TEST_PANIC` makes the parse step
# panic. The tests turn it on through the dev-dependency below; release
# builds never have it.
test-hooks = []

[dev-dependencies]
terminal-decline = { path = ".", features = ["test-hooks"] }
png = "0.18"
