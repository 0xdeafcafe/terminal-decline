[package]
name = "term-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
vte.workspace = true
term-image.workspace = true
memchr = "2.7"

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
insta = { version = "1.49", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
unicode-width.workspace = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "history"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "resize"
harness = false
