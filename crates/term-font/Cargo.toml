[package]
name = "term-font"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
objc2-core-text = { workspace = true, features = ["CTFont", "CTFontCollection", "CTFontDescriptor", "CTFontManager", "CTFontTraits", "CTLine", "CTRun", "CTStringAttributes", "objc2-core-graphics"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGFont", "CGImage", "CGPath"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFNumber", "CFURL"] }
libc.workspace = true

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "shape"
harness = false
