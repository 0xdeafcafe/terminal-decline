[package]
name = "term-prefs"
description = "The preferences: the settings schema, safe edits to config.toml, and the TUI that makes them"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
