[package]
name = "term-restore"
description = "Restarting into a new build: the saved window list, the pane tree it saves, and each pane's history, with no AppKit"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
term-core.workspace = true
term-activity.workspace = true
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
